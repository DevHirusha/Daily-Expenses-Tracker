spring.application.name=Backend
server.port=${PORT:8080}
# Local port for development
#server.port=${SERVER_PORT:3030}

# Database settings must be provided through deployment environment variables.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_DATABASE:daily_expenses}?useSSL=${DB_USE_SSL:true}&requireSSL=${DB_REQUIRE_SSL:true}&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

jwt.secret.key=${JWT_SECRET_KEY}
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.properties.mail.smtp.from=${MAIL_FROM:no-reply@localhost}
app.mail.enabled=${MAIL_ENABLED:false}

# Bootstrap account settings must be provided through deployment environment variables.
app.super-admin.enabled=${SUPER_ADMIN_ENABLED:false}
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.username=${SUPER_ADMIN_USERNAME:}
app.super-admin.name=${SUPER_ADMIN_NAME:}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}
