spring.application.name=Backend
server.port=${SERVER_PORT:3030}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/daily_expenses?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

jwt.secret.key=${JWT_SECRET_KEY:daily-expenses-tracker-local-secret-key-2026}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.properties.mail.smtp.from=${MAIL_FROM:no-reply@localhost}
app.mail.enabled=${MAIL_ENABLED:false}
